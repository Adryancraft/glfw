
name: Build Traincrafts

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Extract Traincraft source
        run: |
          unzip -q Traincrafts.zip -d source
          test -f source/Traincraft-master/gradlew
          chmod +x source/Traincraft-master/gradlew

      - name: Compile mod
        working-directory: source/Traincraft-master
        run: ./gradlew --no-daemon clean build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: Traincraft-1.12.2-build
          path: source/Traincraft-master/build/libs/*.jar
          if-no-files-found: error

                  
